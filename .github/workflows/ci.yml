name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
            build
            style
            revert
          requireScope: false

  validation:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - name: Generate coverage summary
        id: coverage
        run: pnpm coverage:summary
        continue-on-error: true

      - name: Publish coverage summary to Checks UI
        if: steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure'
        run: |
          {
            echo "# Coverage check"
            echo
            if [ "${{ steps.coverage.outcome }}" = "success" ]; then
              echo "Result: passed"
            else
              echo "Result: failed"
            fi
            echo
            cat .coverage-reports/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save coverage metadata for PR comment
        if: steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure'
        run: |
          echo "${{ github.event.pull_request.number }}" > .coverage-reports/pr-number.txt
          echo "${{ steps.coverage.outcome }}" > .coverage-reports/outcome.txt

      - name: Upload coverage report artifacts
        if: steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: .coverage-reports

      - name: Enforce coverage summary status
        if: steps.coverage.outcome == 'failure'
        run: exit 1
